name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Type Check, Lint, Format, and Test
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dev dependencies with uv
      run: |
        uv sync --python 3.10 --all-groups --frozen

    - name: Linter
      run: |
        uv run ruff check .

    - name: Format Check
      run: |
        uv run ruff format --check .

    - name: Run mypy
      run: |
        uv run mypy .

    - name: Install browser for local HTML contract tests
      run: uv run playwright install --with-deps chromium

    - name: Run pytest with JUnit XML output
      env:
        TIKTOK_TOOL_BROWSER_TESTS: "1"
      run: |
        uv run pytest --junitxml=test-results.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: junit-test-results
        path: test-results.xml
